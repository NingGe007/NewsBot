name: Daily Market Report

on:
  workflow_dispatch:
    inputs:
      report_type:
        description: '报告类型'
        required: true
        default: '晚报'
        type: choice
        options:
          - 早报
          - 晚报
  schedule:
    - cron: '57 23 * * 0-4'   # UTC 23:57 = 北京 7:57 → A股早报 + 美股晚报（美股刚收盘）
    - cron: '33 8 * * 1-5'    # UTC 8:33  = 北京 16:33 → A股/港股晚报（A股刚收盘）
    - cron: '3 13 * * 1-5'    # UTC 13:03 = 北京 21:03 → 美股早报（美股盘前）

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 恢复状态文件
        uses: actions/cache/restore@v4
        with:
          path: |
            seen_ids.json
            today_pushed.json
          key: newsbot-state-${{ github.run_id }}
          restore-keys: |
            newsbot-state-

      - name: 确保状态文件存在
        run: |
          test -f seen_ids.json || echo '{"ids": []}' > seen_ids.json
          test -f today_pushed.json || echo '[]' > today_pushed.json

      - run: pip install -r requirements.txt

      - name: 发送日报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          HOUR=$(date -u +%H)
          if [ -n "${{ github.event.inputs.report_type }}" ]; then
            python daily_report.py "${{ github.event.inputs.report_type }}"
          elif [ "$HOUR" -ge 23 ] || [ "$HOUR" -le 1 ]; then
            # 北京 7:57 — A股早报 + 美股晚报
            python daily_report.py cn_morning
            python daily_report.py us_evening
          elif [ "$HOUR" -ge 8 ] && [ "$HOUR" -le 9 ]; then
            # 北京 16:33 — A股/港股晚报
            python daily_report.py cn_evening
          elif [ "$HOUR" -ge 12 ] && [ "$HOUR" -le 14 ]; then
            # 北京 21:03 — 美股早报
            python daily_report.py us_morning
          fi

      - name: 保存状态文件
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            seen_ids.json
            today_pushed.json
          key: newsbot-state-${{ github.run_id }}
